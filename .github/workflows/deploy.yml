# Image, deploy. Builds the API image, pushes it to Artifact Registry and makes
# it the running revision of the Cloud Run service. The one-time setup this
# relies on (the service, the deploy service account, Workload Identity
# Federation and the three repository variables) is in docs/deploy.md.
#
# Runs only when started by hand (Actions > deploy > Run workflow, or
# gh workflow run deploy.yml), not on push. Run it from main: the Workload
# Identity provider trusts main only. The tests are not run here; the CI
# workflow runs them on every push to main.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# A second run waits for the first deploy to finish instead of racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Must match the names in docs/deploy.md.
  REGION: me-central1
  REPOSITORY: kfupm-facility-booking
  SERVICE: kfupm-facility-booking

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets google-github-actions/auth exchange a GitHub-issued token for a
      # Google one through Workload Identity Federation. No Google key is stored.
      id-token: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: name
        run: echo "image=$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$REPOSITORY/api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ResourceManager.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      # Changes the image only. Every other setting of the service (database,
      # secrets, environment, probes) stays as set up in docs/deploy.md.
      - run: |
          gcloud run services update "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --image "${{ needs.image.outputs.image }}"
