# Image, deploy. Builds the API image, pushes it to GHCR and makes it the
# running revision on Azure Container Apps. The one-time setup this relies on
# (the container app, the federated credential, the three secrets) is in
# docs/deploy.md.
#
# Runs only when started by hand (Actions > deploy > Run workflow, or
# gh workflow run deploy.yml), not on push. The Azure resources are not set up
# yet, and a deploy that fires on every push would fail until they are. Run it
# from main: the federated credential trusts main only. The tests are not run
# here; the CI workflow runs them on every push to main.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# A second run waits for the first deploy to finish instead of racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mofadel26/kfupm-facility-booking
  # Must match RESOURCE_GROUP and APP_NAME in infra/deploy.sh.
  RESOURCE_GROUP: kfupm-facility-booking-rg
  APP_NAME: kfupm-facility-booking

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ResourceManager.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets azure/login exchange a GitHub-issued token for an Azure one
      # through the federated credential. No Azure password is stored.
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:$GITHUB_SHA"
