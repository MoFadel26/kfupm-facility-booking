name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build & test
    runs-on: ubuntu-latest

    # The integration tests run against a real PostgreSQL. The reservation overlap
    # rule is an exclusion constraint over a tstzrange, which no in-memory provider
    # can enforce, so a fake database would report a passing suite for a broken rule.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
        env:
          # Each test run creates and drops its own database on this server.
          TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres;"
